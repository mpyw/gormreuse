name: CI

on:
  push: {}
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  declscope:
    name: declscope
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up mise
        uses: jdx/mise-action@v2

      - name: Run declscope
        run: declscope ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.27']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go-version }}

      - name: Run tests with coverage
        run: go test -timeout=20m -v -race -coverprofile=coverage.txt -covermode=atomic -coverpkg=./... ./...

      - name: Run E2E tests (SQL behavior)
        run: go test -v ./...
        working-directory: e2e/internal

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.txt
          flags: unittests
          name: codecov-go${{ matrix.go-version }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # golangci-lint refuses to load a module whose go directive is newer
          # than the Go version it was itself built with, so it has to track the
          # latest release.
          version: latest
          args: --timeout=5m
