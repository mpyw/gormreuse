name: CI

# Pushes run only on main: a branch with an open PR is already covered by the
# pull_request event, and running both doubled every PR's CI. The push run on
# main is also the one tag.yml requires before it tags a commit.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Actions are pinned by full commit SHA; the trailing comment is the release
# the SHA belongs to, which dependabot keeps up to date.
jobs:
  declscope:
    name: declscope
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up mise
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1

      # shrink goes first: a declaration it would unexport becomes private to
      # its file, and the analyzer then judges that narrower scope.
      - name: Run declscope shrink
        run: declscope shrink ./...

      - name: Run declscope
        run: declscope ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    # id-token: write is what the coverage upload authenticates with, in
    # place of a stored token. A job's permissions replace the workflow's
    # rather than add to them, so contents: read is restated here.
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        go-version: ['1.27']

    steps:
      # TestReadmeVersionPinsAgree compares the README's pins with the newest
      # release tag. A shallow clone has no tags, so the full history is
      # fetched, as tag.yml and release.yml do.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}

      - name: Run tests with coverage
        run: go test -timeout=20m -v -race -coverprofile=coverage.txt -covermode=atomic -coverpkg=./... ./...

      - name: Run E2E tests (SQL behavior)
        run: go test -v ./...
        working-directory: e2e/internal

      # The tests only compare the .golden/.diff fixtures; they must never
      # rewrite tracked files (#203) or leave new ones. git diff misses
      # untracked files, so check git status as test_all.sh does (#264).
      - name: Check that the tests left the working tree unchanged
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::the tests changed files in the working tree"
            git status --short
            git diff
            exit 1
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.txt
          flags: unittests
          name: codecov-go${{ matrix.go-version }}
          use_oidc: true
        continue-on-error: true

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # golangci-lint comes from mise.toml, so CI and local runs use the same
      # version. It refuses to load a module whose go directive is newer than
      # the Go it was built with, so bump it there with the go directive.
      - name: Set up mise
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1

      - name: Run golangci-lint
        run: golangci-lint run ./...

      # e2e/internal is its own module, so the root run does not reach it.
      - name: Run golangci-lint (e2e/internal)
        run: golangci-lint run ./...
        working-directory: e2e/internal
