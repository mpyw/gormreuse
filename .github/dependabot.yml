version: 2
updates:
  - package-ecosystem: gomod
    # e2e/internal is a separate module. It pins the GORM version the e2e
    # tests run against, so it needs its own entry.
    directories:
      - /
      - /e2e/internal
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      go-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
