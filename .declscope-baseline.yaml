# declscope baseline
#
# Violations recorded here are suppressed; new ones are still reported.
# Regenerate with:
#
#     declscope baseline ./...
#
# Do not edit by hand. An entry disappears when its violation is fixed, so the
# diff of a regeneration is the record of what was cleaned up.
packages:
  github.com/mpyw/gormreuse/internal:
    qualify:
      analyzer:
        - RunSSA
        - checker
        - computeNeedsImmutableParam
        - editKey
        - newChecker
        - recoverPerFunction
        - reportImmutableReturnViolations
        - reportRedundantImmutableParam
        - reportUnusedDirectiveFuncs
      scopesSessionWarning:
        - allocFlowsToScopes
        - callPassesFuncToScopes
        - getMethodName
        - isGormDBMethodCall
        - isScopesCallback
        - scopesWarning
        - sliceFlowsToScopes
        - storePacksFuncIntoScopes
        - storeRefersToFunction
        - validateScopesCallback
  github.com/mpyw/gormreuse/internal/directive:
    qualify:
      directive:
        - ExtractImmutableInputParams
      immutableInput:
        - asFunctionSignature
        - assertOneUnused
        - paramRef
        - parseFileWithTypes
      pure:
        - BuildImmutableParamFunctionSet
        - BuildImmutableReturnFunctionSet
        - DirectiveFuncSet
        - FuncKey
        - NewImmutableParamFuncSet
        - NewImmutableReturnFuncSet
        - buildFunctionSet
        - directiveChecker
        - funcDeclTypes
        - funcLitTypes
        - newDirectiveFuncSet
        - signatureValidator
      signature:
        - HasGormDBParameter
        - cacheEntry
        - containsGormDB
        - containsGormDBWithCache
        - hasGormDBParameter
        - hasGormDBReturn
      typestr:
        - exprToString
        - formatReceiverType
        - stripPointer
  github.com/mpyw/gormreuse/internal/ssa/purity:
    qualify:
      immutableReturn:
        - isGormChainCall
      validator:
        - ValidateFunction
        - Violation
        - calleeName
