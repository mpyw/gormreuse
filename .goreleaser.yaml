# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: gormreuse

before:
  hooks:
    - go mod tidy

builds:
  # Pure Go analysis binary — no CGO, so every platform cross-compiles.
  - id: gormreuse
    main: ./cmd/gormreuse
    binary: gormreuse
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - CHANGELOG.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

# The commit list, grouped by conventional-commit type. CHANGELOG.md holds the
# hand-written notes: what changes for users and what to do about it.
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs(\\(.+\\))?:"
      - "^test(\\(.+\\))?:"
      - "^chore(\\(.+\\))?:"
      - "^ci(\\(.+\\))?:"
      - Merge pull request
      - Merge branch
  groups:
    - title: Breaking changes
      regexp: '^[a-z]+(\(.+\))?!:'
      order: 0
    - title: Features
      regexp: '^feat(\(.+\))?:'
      order: 1
    - title: Bug fixes
      regexp: '^fix(\(.+\))?:'
      order: 2
    - title: Performance
      regexp: '^perf(\(.+\))?:'
      order: 3
    - title: Refactoring
      regexp: '^refactor(\(.+\))?:'
      order: 4
    - title: Others
      order: 999

release:
  github:
    owner: mpyw
    name: gormreuse
  draft: false
  # No prerelease setting: tag.yml and release.yml accept only vX.Y.Z, so a
  # prerelease version never reaches goreleaser.
  name_template: "v{{.Version}}"
  header: |
    See [CHANGELOG.md](https://github.com/mpyw/gormreuse/blob/v{{ .Version }}/CHANGELOG.md) for the new diagnostics and what to do about them.
